services:
  backend:
    build:
      context: ./backend
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5126
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?set ConnectionStrings__DefaultConnection in .env}
      Jwt__SecretKey: ${Jwt__SecretKey:?set Jwt__SecretKey in .env}
      Auth__Google__ClientId: ${Auth__Google__ClientId:-}
      Auth__Google__ClientSecret: ${Auth__Google__ClientSecret:-}
      Email__Host: ${Email__Host:-mailpit}
      Email__Port: ${Email__Port:-1025}
      Email__Security: ${Email__Security:-None}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
    ports:
      - 127.0.0.1:5126:5126
    volumes:
      - ./backend:/app
      - nuget_packages:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_USE_POLLING: "true"
      VITE_SERVER_BASE_URL: ${VITE_SERVER_BASE_URL:-http://localhost:5126}
    ports:
      - 127.0.0.1:5173:5173
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  node_modules:
  nuget_packages: